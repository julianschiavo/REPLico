name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_call:
    inputs:
      revision:
        description: Commit to test
        type: string
        default: ''

concurrency:
  group: replico-test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NSUnbufferedIO: 'YES'
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.2.app/Contents/Developer
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 60
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      # Ubuntu builds SwiftSyntax from source. Reuse its build state only with the same runner image and toolchain.
      - name: Identify Linux build environment
        if: runner.os == 'Linux'
        id: linux
        run: |
          toolchain=$(swiftc -print-target-info | sha256sum | cut -d' ' -f1)
          echo "prefix=swift-build-v1-${ImageVersion:?}-$toolchain" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM and Node caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ${{ runner.os == 'Linux' && '.build' || '.build/repositories' }}
            .runtime/downloads
          key: ${{ steps.linux.outputs.prefix || 'downloads-v1' }}-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/runtime.py') }}

      - name: Prepare pinned Node
        run: scripts/runtime.py prepare

      - name: Install xcbeautify on Linux
        if: runner.os == 'Linux'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install xcbeautify
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Run package, worker and maintenance tests
        run: |
          swift --version
          scripts/test.sh

      - name: Save verified caches from main
        if: >-
          success() && steps.cache.outputs.cache-hit != 'true' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
          github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' &&
          inputs.revision == github.event.pull_request.merge_commit_sha))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
